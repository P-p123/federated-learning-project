<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Behavior Analysis - Federated Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .behavior-card {
            border-left: 5px solid;
            position: relative;
        }

        .behavior-card.honest {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), transparent);
        }

        .behavior-card.slow {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), transparent);
        }

        .behavior-card.sleepy {
            border-color: #8b5cf6;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), transparent);
        }

        .behavior-card.fast {
            border-color: #3b82f6;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05), transparent);
        }

        .behavior-card.unreliable {
            border-color: #ef4444;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), transparent);
        }

        .behavior-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85em;
            margin-bottom: 15px;
        }

        .behavior-title {
            font-size: 1.3em;
            margin: 15px 0;
            font-weight: 700;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            font-weight: 700;
            color: #333;
        }

        .round-breakdown {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .round-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #667eea;
            font-weight: 700;
        }

        .client-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 15px;
            padding: 15px;
            border-radius: 8px;
            background: #f8f9fa;
            margin-bottom: 10px;
            align-items: center;
        }

        .client-row:hover {
            background: #f0f1f5;
        }

        .client-name {
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85em;
            text-align: center;
        }

        .status-trained {
            background: #d1fae5;
            color: #10b981;
        }

        .status-skipped {
            background: #fee2e2;
            color: #ef4444;
        }

        .accuracy-value {
            font-weight: 700;
            color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }

        .behavior-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .behavior-stat {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .behavior-stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }

        .behavior-stat-label {
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .summary-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .summary-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: 1.8em;
            font-weight: 700;
            margin: 10px 0;
        }

        .summary-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-bar"></i> Client Behavior Analysis</h1>
            <p>Federated Learning - Hospital Client Behavior Tracking</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('behavior-summary')">
                <i class="fas fa-tasks"></i> Behavior Summary
            </button>
            <button class="tab-btn" onclick="switchTab('round-analysis')">
                <i class="fas fa-layer-group"></i> Round-by-Round
            </button>
            <button class="tab-btn" onclick="switchTab('client-details')">
                <i class="fas fa-hospital-user"></i> Hospital Details
            </button>
            <button class="tab-btn" onclick="switchTab('stats')">
                <i class="fas fa-chart-pie"></i> Statistics
            </button>
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <!-- BEHAVIOR SUMMARY TAB -->
        <div id="behavior-summary" class="tab-content active">
            <div class="summary-box">
                <div class="summary-content" id="summary-stats">
                    <div class="loading">
                        <div class="spinner"></div>
                        Loading summary...
                    </div>
                </div>
            </div>

            <div class="grid" id="behavior-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading behavior data...
                </div>
            </div>
        </div>

        <!-- ROUND-BY-ROUND TAB -->
        <div id="round-analysis" class="tab-content">
            <div style="margin-bottom: 20px;">
                <label for="round-select" style="font-weight: 600; margin-right: 10px;">Select Round:</label>
                <select id="round-select" onchange="loadRoundBreakdown()" style="padding: 8px 12px; border-radius: 6px; border: 2px solid #667eea;">
                    <option value="">Loading rounds...</option>
                </select>
            </div>
            <div id="round-breakdown">
                <div class="loading">
                    <div class="spinner"></div>
                    Select a round to view details...
                </div>
            </div>
        </div>

        <!-- CLIENT DETAILS TAB -->
        <div id="client-details" class="tab-content">
            <div style="margin-bottom: 20px;">
                <label for="client-select" style="font-weight: 600; margin-right: 10px;">Select Hospital:</label>
                <select id="client-select" onchange="loadClientDetails()" style="padding: 8px 12px; border-radius: 6px; border: 2px solid #667eea;">
                    <option value="">Loading hospitals...</option>
                </select>
            </div>
            <div id="client-details-content">
                <div class="loading">
                    <div class="spinner"></div>
                    Select a hospital to view details...
                </div>
            </div>
        </div>

        <!-- STATS TAB -->
        <div id="stats" class="tab-content">
            <div class="grid">
                <div class="card">
                    <h3>Behavior Distribution</h3>
                    <div class="chart-container">
                        <canvas id="behavior-chart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3>Training Success Rate by Behavior</h3>
                    <div class="chart-container">
                        <canvas id="success-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const HOSPITALS = [
            { id: 0, name: "Mayo Clinic" },
            { id: 1, name: "Cleveland Clinic" },
            { id: 2, name: "Johns Hopkins" },
            { id: 3, name: "Massachusetts General" },
            { id: 4, name: "UCLA Medical Center" },
            { id: 5, name: "NYU Langone" },
            { id: 6, name: "Duke University Hospital" },
            { id: 7, name: "Stanford Hospital" },
            { id: 8, name: "Mount Sinai Hospital" },
            { id: 9, name: "Barnes-Jewish Hospital" }
        ];

        const BEHAVIOR_COLORS = {
            'honest': '#10b981',
            'slow': '#f59e0b',
            'sleepy': '#8b5cf6',
            'fast': '#3b82f6',
            'unreliable': '#ef4444'
        };

        let behaviorCharts = {};

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'behavior-summary') loadBehaviorSummary();
            if (tab === 'stats') loadStatistics();
            if (tab === 'round-analysis') loadRoundSelect();
        }

        function loadBehaviorSummary() {
            fetch('/behavior_summary')
                .then(r => r.json())
                .then(data => {
                    let summary = `<div class="summary-content">`;
                    let totalClients = 0;
                    let totalAvgAccuracy = 0;

                    for (const [behavior, stats] of Object.entries(data)) {
                        if (stats.count > 0) {
                            totalClients += stats.count;
                            totalAvgAccuracy += stats.avg_accuracy * stats.count;
                            summary += `
                                <div class="summary-item">
                                    <div style="font-size: 1.2em;">${getBehaviorIcon(behavior)}</div>
                                    <div class="summary-value">${stats.count}</div>
                                    <div class="summary-label">${behavior.toUpperCase()}</div>
                                </div>
                            `;
                        }
                    }

                    summary += `
                        <div class="summary-item">
                            <div style="font-size: 1.2em;"><i class="fas fa-chart-line"></i></div>
                            <div class="summary-value">${((totalAvgAccuracy / totalClients) * 100).toFixed(2)}%</div>
                            <div class="summary-label">AVG ACCURACY</div>
                        </div>
                    </div>`;

                    document.getElementById('summary-stats').innerHTML = summary;

                    let grid = '';
                    for (const [behavior, stats] of Object.entries(data)) {
                        if (stats.count > 0) {
                            grid += `
                                <div class="card behavior-card ${behavior}">
                                    <div class="behavior-badge" style="background: ${BEHAVIOR_COLORS[behavior]}; color: white;">
                                        ${getBehaviorIcon(behavior)} ${behavior.toUpperCase()}
                                    </div>
                                    <div class="behavior-title">${stats.count} ${behavior === 'honest' ? 'Hospital' : 'Hospitals'}</div>
                                    <div class="stat-row">
                                        <span class="stat-label">Avg Accuracy:</span>
                                        <span class="stat-value">${(stats.avg_accuracy * 100).toFixed(2)}%</span>
                                    </div>
                                    <div class="stat-row">
                                        <span class="stat-label">Avg Trained:</span>
                                        <span class="stat-value">${stats.avg_trained_rounds.toFixed(1)} rounds</span>
                                    </div>
                                    <hr style="margin: 15px 0; border: none; border-top: 1px solid #ddd;">
                                    <div style="font-size: 0.9em; color: #666;">
                                        <strong>Hospitals:</strong><br>
                                        ${stats.clients.map(c => `${c.hospital_name} (${(c.final_accuracy * 100).toFixed(2)}%)`).join('<br>')}
                                    </div>
                                </div>
                            `;
                        }
                    }

                    document.getElementById('behavior-grid').innerHTML = grid;
                });
        }

        function loadRoundSelect() {
            fetch('/clients')
                .then(r => r.json())
                .then(data => {
                    const maxRounds = data.clients.length > 0 ? Math.max(...data.clients.map(c => c.round)) : 10;
                    let options = '';
                    for (let i = 1; i <= maxRounds; i++) {
                        options += `<option value="${i}">Round ${i}</option>`;
                    }
                    document.getElementById('round-select').innerHTML = options;
                });
        }

        function loadRoundBreakdown() {
            const round = document.getElementById('round-select').value;
            if (!round) return;

            fetch(`/round_breakdown/${round}`)
                .then(r => r.json())
                .then(data => {
                    let html = `
                        <div class="round-breakdown">
                            <div class="round-title"><i class="fas fa-layer-group"></i> Round ${data.round} Breakdown</div>
                            <div class="summary-box" style="margin-bottom: 20px;">
                                <div class="summary-content">
                                    <div class="summary-item">
                                        <div style="font-size: 1.2em;"><i class="fas fa-users"></i></div>
                                        <div class="summary-value">${data.summary.total_clients}</div>
                                        <div class="summary-label">TOTAL CLIENTS</div>
                                    </div>
                                    <div class="summary-item">
                                        <div style="font-size: 1.2em;"><i class="fas fa-check-circle"></i></div>
                                        <div class="summary-value">${data.summary.trained}</div>
                                        <div class="summary-label">TRAINED</div>
                                    </div>
                                    <div class="summary-item">
                                        <div style="font-size: 1.2em;"><i class="fas fa-times-circle"></i></div>
                                        <div class="summary-value">${data.summary.skipped}</div>
                                        <div class="summary-label">SKIPPED</div>
                                    </div>
                                    <div class="summary-item">
                                        <div style="font-size: 1.2em;"><i class="fas fa-chart-line"></i></div>
                                        <div class="summary-value">${(data.summary.avg_accuracy * 100).toFixed(2)}%</div>
                                        <div class="summary-label">AVG ACCURACY</div>
                                    </div>
                                </div>
                            </div>
                            <h3 style="margin: 20px 0;">Client Status</h3>
                    `;

                    for (const client of data.clients) {
                        const status = client.trained ? 'trained' : 'skipped';
                        html += `
                            <div class="client-row">
                                <div class="client-name">
                                    ${getBehaviorIcon(client.behavior)} ${client.hospital_name}
                                </div>
                                <div class="status-badge status-${status}">
                                    ${client.trained ? '✓ Trained' : '⊘ Skipped'}
                                </div>
                                <div>${client.delay.toFixed(2)}s</div>
                                <div class="accuracy-value">${(client.accuracy * 100).toFixed(2)}%</div>
                                <div style="color: #666; font-size: 0.9em;">
                                    P: ${(client.precision * 100).toFixed(0)}% | R: ${(client.recall * 100).toFixed(0)}%
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                    document.getElementById('round-breakdown').innerHTML = html;
                });
        }

        function loadClientDetails() {
            const clientId = document.getElementById('client-select').value;
            if (clientId === '') return;

            fetch(`/client_details/${clientId}`)
                .then(r => r.json())
                .then(data => {
                    let html = `
                        <div class="card behavior-card ${data.behavior}">
                            <div class="behavior-badge" style="background: ${BEHAVIOR_COLORS[data.behavior]}; color: white;">
                                ${getBehaviorIcon(data.behavior)} ${data.behavior.toUpperCase()}
                            </div>
                            <div class="behavior-title">${data.hospital_name}</div>
                            <div class="stat-row">
                                <span class="stat-label">Total Rounds:</span>
                                <span class="stat-value">${data.stats.total_rounds}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Trained Rounds:</span>
                                <span class="stat-value">${data.stats.trained_rounds}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Skipped Rounds:</span>
                                <span class="stat-value">${data.stats.skipped_rounds}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Avg Delay:</span>
                                <span class="stat-value">${data.stats.avg_delay}s</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Avg Accuracy:</span>
                                <span class="stat-value">${(data.stats.avg_accuracy * 100).toFixed(2)}%</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Final Accuracy:</span>
                                <span class="stat-value">${(data.stats.final_accuracy * 100).toFixed(2)}%</span>
                            </div>
                            <hr style="margin: 15px 0;">
                            <h3 style="margin: 15px 0;">Round-by-Round History</h3>
                    `;

                    for (const round of data.history) {
                        html += `
                            <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 0.9em;">
                                <strong>Round ${round.round}</strong>
                                <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                                    <span>${round.trained ? '✓ Trained' : '⊘ Skipped'}</span>
                                    <span>Acc: ${(round.accuracy * 100).toFixed(2)}%</span>
                                    <span>Delay: ${round.delay.toFixed(2)}s</span>
                                </div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                    document.getElementById('client-details-content').innerHTML = html;
                });
        }

        function loadStatistics() {
            fetch('/behavior_summary')
                .then(r => r.json())
                .then(data => {
                    const behaviors = Object.keys(data).filter(b => data[b].count > 0);
                    const counts = behaviors.map(b => data[b].count);
                    const accuracies = behaviors.map(b => (data[b].avg_accuracy * 100).toFixed(2));

                    // Behavior Distribution Chart
                    const ctx1 = document.getElementById('behavior-chart');
                    if (behaviorCharts['behavior']) behaviorCharts['behavior'].destroy();
                    behaviorCharts['behavior'] = new Chart(ctx1, {
                        type: 'doughnut',
                        data: {
                            labels: behaviors.map(b => b.toUpperCase()),
                            datasets: [{
                                data: counts,
                                backgroundColor: behaviors.map(b => BEHAVIOR_COLORS[b])
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { labels: { color: '#333', font: { size: 12 } } }
                            }
                        }
                    });

                    // Success Rate Chart
                    const ctx2 = document.getElementById('success-chart');
                    if (behaviorCharts['success']) behaviorCharts['success'].destroy();
                    behaviorCharts['success'] = new Chart(ctx2, {
                        type: 'bar',
                        data: {
                            labels: behaviors.map(b => b.toUpperCase()),
                            datasets: [{
                                label: 'Avg Accuracy (%)',
                                data: accuracies,
                                backgroundColor: behaviors.map(b => BEHAVIOR_COLORS[b])
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { max: 100, ticks: { color: '#333' }, grid: { color: '#eee' } },
                                x: { ticks: { color: '#333' }, grid: { display: false } }
                            },
                            plugins: { legend: { labels: { color: '#333' } } }
                        }
                    });
                });
        }

        function getBehaviorIcon(behavior) {
            const icons = {
                'honest': '✓',
                'slow': '🐌',
                'sleepy': '😴',
                'fast': '⚡',
                'unreliable': '⚠️'
            };
            return icons[behavior] || '?';
        }

        // Initialize
        function initPage() {
            fetch('/clients')
                .then(r => r.json())
                .then(data => {
                    let options = '';
                    for (const hospital of HOSPITALS) {
                        options += `<option value="${hospital.id}">${hospital.name}</option>`;
                    }
                    document.getElementById('client-select').innerHTML = options;
                });
            loadBehaviorSummary();
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
